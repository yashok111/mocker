# golangci-lint v2, carried over from scip24's backend so one linter set covers
# both repositories. Differences from that copy are only where this project's
# shape differs, and each is noted below.
version: "2"

run:
  timeout: 5m
  go: "1.27"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocyclo
    - gosec
    - misspell
    - revive
    - unconvert
    - unused
    - prealloc
    - nilerr
    - copyloopvar
    # tightened set (bug-focused, low-noise)
    - contextcheck
    - durationcheck
    - errname
    - gocheckcompilerdirectives
    - makezero
    - noctx
    - predeclared
    - reassign
    - rowserrcheck
    - sqlclosecheck
    - usestdlibvars
    - wastedassign
  settings:
    gocyclo:
      # 20 — stricter than the tool default (30).
      min-complexity: 20
    revive:
      severity: warning
      rules:
        - name: var-naming
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true
    gosec:
      excludes:
        - G104 # already covered by errcheck
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - noctx # test requests don't need context propagation
          # gocyclo measures branches, and an acceptance test is branches by
          # construction: one table walking every operation of a real spec
          # scores 74 while being perfectly readable. The metric exists to keep
          # SERVING paths comprehensible, and that is where it stays enabled.
          - gocyclo
      # G115 (integer overflow on conversion) fires 14 times inside the
      # deterministic generator, and every one is a uint64 PRNG word being cut
      # to the width the value needs — that IS the algorithm, not an accident,
      # and the golden file over 419 bodies is what actually pins it. Scoped by
      # path rather than excluded globally so a real truncation in the HTTP,
      # admin or storage code is still caught.
      - path: internal/(gen|recipes|auth)/
        text: "integer overflow conversion"
        linters:
          - gosec

issues:
  # Defaults hide work: max-same-issues is 3 and max-issues-per-linter is 50,
  # so a repeated finding shows three sites and silently drops the rest —
  # which reads as "fixed" the moment those three are gone. Everything or
  # nothing.
  max-same-issues: 0
  max-issues-per-linter: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - git.sumka.site/yakov/mocker
